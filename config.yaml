# Central configuration. All experiments read from here.
seed: 2026
hospital:
  icu_capacity: 20                 # single hospital, single ICU, beds are the only constraint
window:
  slots_per_day: 48                # every 30-min window of the day (00:00-00:30 ... 23:30-24:00) is simulated
  diurnal_amplitude: 0.4           # arrival-rate multiplier 1 + 0.4*cos(2*pi*(hour-15)/24): peak 15:00, trough 03:00
  diurnal_congestion_shift: 0.5    # shifts scenario probabilities toward high congestion at peak hours
  duration_min: 30                 # patient-arrival cohort window (NOT a decision step)
  max_horizon_h: 72.0              # safety limit on follow-up after window start
data:
  n_episodes: 1000
  split: {train: 700, val: 100, test: 200}
  scenarios:                       # synthetic congestion assumptions (not hospital statistics)
    low:    {prob: 0.25, free_beds: [3, 5], arrival_mean: 5.0}
    medium: {prob: 0.45, free_beds: [1, 3], arrival_mean: 8.0}
    high:   {prob: 0.30, free_beds: [0, 1], arrival_mean: 12.0}
  arrival_intensity_slope: 0.4     # NHPP: lambda(t) proportional to 1 + slope * t/T
  los: {median_arrival_h: 8.0, sigma: 0.3, z_coef: 3.0, age_coef: 0.008, vent_coef: 0.35, occupant_mult: 6.0}  # occupants length-biased
  occupant_elapsed_frac: [0.1, 0.9]
  deterioration: {base_rate_h: 0.03, z_coef: 2.2, age_coef: 0.015, hypox_coef: 0.5, frailty_sd: 0.35, dz_range: [0.08, 0.18], max_events: 3}
env:
  w_ref_h: 8.0                     # waiting-time reference for normalisation / reward 2
  dur_scale_h: 48.0
  hazard_scale: 0.3
  tau0_h: 1.0
  gamma: 0.99
  high_sofa_threshold: 11          # fixed a priori (Ferreira et al. 2001 upper mortality band)
reward:
  r1: {lambda_u: 30.0, scale: 0.05}
  r2: {alpha: 1.0, beta: 1.0, lambda_u: 30.0, scale: 0.1}
train:
  episodes: 6000
  eval_every: 200
  eval_episodes: 100
  seeds: [0, 1, 2, 3, 4]
  dqn: {lr: 0.001, batch: 64, buffer: 50000, target_update: 250, warmup: 500, eps_start: 1.0, eps_end: 0.05, eps_decay_frac: 0.4, hidden: 64, explore_stop_prob: 0.05}
  ppo: {lr: 0.0003, episodes_per_iter: 32, epochs: 4, minibatch: 256, clip: 0.2, ent: 0.01, vf: 0.5, gae_lambda: 0.95, hidden: 64}
eval:
  random_seeds: [0, 1, 2, 3, 4]
